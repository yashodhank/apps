async function record(key,b){if(MR&&MR.state==='recording'){MR.stop();return}try{var stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];MR=new MediaRecorder(stream);active={key:key,b:b,stream:stream};b.classList.add('recording');b.textContent='■ Stop';document.getElementById('st_'+key).textContent='Recording…';MR.ondataavailable=function(e){chunks.push(e.data)};MR.onstop=async function(){var blob=new Blob(chunks,{type:MR.mimeType||'audio/webm'});await putAudio(key,blob);D[key]=D[key]||{};D[key].audio=true;localStorage.p11data=JSON.stringify(D);active.stream.getTracks().forEach(function(t){t.stop()});MR=null;b.classList.remove('recording');b.textContent='● Record audio';document.getElementById('st_'+key).textContent='Saved locally';showAudio(key,blob);stats()};MR.start()}catch(e){alert('Microphone unavailable. Open this site over HTTPS and allow microphone permission.')}}
