'Define the regulated scope before choosing technology. Identify which processes and electronic records actually matter.',

'Assess physical access, cooling, power resilience and environmental protection.',
'Separate ordinary endpoint controls from laboratory endpoints that may have vendor/validation constraints.',
'Check clock consistency and whether logs can be correlated and protected.',

['GxP','Predicate rule','Electronic record'],['Asset inventory','GxP criticality'],['HPLC','Raw data','CDS','Metadata'],['Audit trail','Reprocessing','Reason for change'],['Electronic signature','Signature meaning'],['RBAC','Privileged account','Service account','MFA'],['Entra ID','Conditional Access','Global Administrator'],['Workgroup','Domain join','Virtualization'],['RAID','Snapshot','Immutable','WORM'],['Backup','Archive','RPO','RTO'],['NAT','VPN','IPS'],['VLAN','Trunk','DHCP','DNS','NTP'],['SSID','WPA2/WPA3','Client isolation'],['UPS','Environmental monitoring'],['EDR','Disk encryption','Patch management'],['NTP','Syslog','SIEM'],['RDP','VPN','Remote support'],['ACL','Data flow','Authoritative record'],['RPO','RTO','DR'],['URS','IQ','OQ','PQ','CSV','CAPA','Change control'],['Migration window','Rollback','Requalification']

const defs={
'GxP':'Collective shorthand for regulated good-practice requirements affecting quality-related processes and records.','Predicate rule':'The underlying regulation requiring a particular record to be created or retained.','Electronic record':'Information in digital form used or retained as a record.','Asset inventory':'Controlled list of systems/devices and their ownership/configuration.','GxP criticality':'Risk classification based on impact to regulated processes/data.','HPLC':'High-performance liquid chromatography.','Raw data':'Original electronic data and metadata generated before later reporting/transformation.','CDS':'Chromatography Data System.','Metadata':'Context such as user, time, method, sequence, instrument or processing details.','Audit trail':'Computer-generated time-stamped history supporting reconstruction of relevant events.','Reprocessing':'Processing existing raw data again, possibly with changed parameters.','Reason for change':'Documented explanation associated with a modification.','Electronic signature':'Electronic method used by an identified person to sign/approve a record.','Signature meaning':'Purpose such as authored, reviewed, approved or released.','RBAC':'Role-based access control.','Privileged account':'Account with elevated administrative capabilities.','Service account':'Non-human account used by an application/service.','MFA':'Multi-factor authentication.','Entra ID':'Microsoft cloud identity service formerly Azure AD.','Conditional Access':'Microsoft sign-in policy engine.','Global Administrator':'Highly privileged Microsoft tenant role.','Workgroup':'Peer-to-peer Windows model without centralized AD domain management.','Domain join':'Connecting a computer to Active Directory for centralized identity/policy.','Virtualization':'Running isolated virtual servers on physical hosts.','RAID':'Disk redundancy/performance; RAID is not backup.','Snapshot':'Point-in-time storage state; not by itself a complete backup strategy.','Immutable':'Protected from ordinary modification/deletion for a period.','WORM':'Write Once Read Many protection.','Backup':'Recovery copy used to restore data/service.','Archive':'Long-term retained record intended to remain retrievable and protected.','RPO':'Acceptable data-loss window measured in time.','RTO':'Acceptable service-recovery time.','NAT':'Network Address Translation.','VPN':'Encrypted remote/site network connection.','IPS':'Intrusion Prevention System.','VLAN':'Logical network segmentation.','Trunk':'Switch link carrying multiple VLANs.','DHCP':'Automatic IP configuration service.','DNS':'Name-resolution service.','NTP':'Network Time Protocol for clock synchronization.','SSID':'Wi-Fi network name.','WPA2/WPA3':'Wireless security standards.','Client isolation':'Restricts direct traffic between wireless clients.','UPS':'Uninterruptible Power Supply.','Environmental monitoring':'Monitoring temperature, humidity, power or related risks.','EDR':'Endpoint Detection and Response security software.','Disk encryption':'Cryptographic protection of stored data.','Patch management':'Controlled evaluation/testing/deployment of updates.','Syslog':'Standard centralized log forwarding.','SIEM':'Security Information and Event Management platform.','RDP':'Remote Desktop Protocol.','Remote support':'Tools allowing remote control/support of a system.','ACL':'Access Control List defining permissions.','Data flow':'Path data follows between systems/users/storage.','Authoritative record':'Official/original record relied upon by the process.','DR':'Disaster Recovery.','URS':'User Requirements Specification.','IQ':'Installation Qualification.','OQ':'Operational Qualification.','PQ':'Performance Qualification.','CSV':'Computer System Validation.','CAPA':'Corrective and Preventive Action.','Change control':'Formal process for assessing, approving, implementing, testing and closing changes.','Migration window':'Approved period for making changes with acceptable impact.','Rollback':'Method to return to the prior state if a change fails.','Requalification':'Additional qualification/testing after certain changes.'
};
const flat=[];S.forEach((s,si)=>s[2].forEach((q,qi)=>flat.push({si,qi,key:'s'+si+'q'+qi,en:q[0],mix:q[1]})));
let lang=localStorage.getItem('p11v2_lang')||'en',sid=null,idx=0,saveTimer=null,mr=null,chunks=[],rec=null;
const q=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),attr=x=>esc(x).replace(/'/g,'&#39;');
function allSessions(){try{return JSON.parse(localStorage.getItem('p11v2_sessions')||'[]')}catch(e){return[]}}
function putSessions(x){localStorage.setItem('p11v2_sessions',JSON.stringify(x))}
function session(id=sid){return allSessions().find(x=>x.id===id)}
function akey(id=sid){return'p11v2_answers_'+id}
function ans(id=sid){try{return JSON.parse(localStorage.getItem(akey(id))||'{}')}catch(e){return{}}}
function updMeta(p){let a=allSessions(),i=a.findIndex(x=>x.id===sid);if(i<0)return;a[i]=Object.assign({},a[i],p,{updated:new Date().toISOString()});putSessions(a);renderSessions();subtitle()}
function setAns(key,p){let a=ans();a[key]=Object.assign({},a[key]||{},p,{updated:new Date().toISOString()});clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem(akey(),JSON.stringify(a));updMeta({});toast('Autosaved')},300)}
function lbl(si){return lang==='en'?S[si][0][0]:S[si][0][1]}

function shell(){
document.body.innerHTML='<div class="v2"><div class="v2top"><div class="v2topin"><button class="v2btn v2icon" id="v2home">☰</button><div class="v2brand"><b>21 CFR Part 11 Discovery</b><small id="v2sub"></small></div><button class="v2btn v2icon" id="v2search">⌕</button><button class="v2btn v2icon" id="v2review">✓</button></div></div><main id="v2main"></main><div class="v2bottom" id="v2bottom" style="display:none"><div class="v2bottomin"><button class="v2btn" id="v2save">Save now</button><button class="v2btn" id="v2json">JSON</button><button class="v2btn primary" id="v2zip">Export ZIP</button></div></div><div class="v2drawer" id="v2drawer"><div class="v2sheet"><div class="v2sheethead"><h2>Search & jump</h2><button class="v2btn v2icon" id="v2close">×</button></div><input class="v2search" id="v2searchbox" placeholder="Search question, section or term…"><div id="v2results"></div></div></div><div class="v2toast" id="v2toast"></div></div>';
q('v2home').onclick=home;q('v2search').onclick=openSearch;q('v2review').onclick=review;q('v2close').onclick=()=>q('v2drawer').classList.remove('open');q('v2drawer').onclick=e=>{if(e.target===q('v2drawer'))q('v2drawer').classList.remove('open')};q('v2searchbox').oninput=()=>search(q('v2searchbox').value);q('v2save').onclick=()=>{if(sid){localStorage.setItem(akey(),JSON.stringify(ans()));toast('Saved now')}};q('v2json').onclick=exportJSON;q('v2zip').onclick=exportZIP;subtitle();home()
}
function home(){
q('v2bottom').style.display='none';q('v2main').innerHTML='<div class="v2home"><section class="v2hero"><h1>Onsite IT & GxP Discovery</h1><p>Typeform-style interview flow with question context, terminology help, local autosave, audio evidence, search and multi-session storage.</p><div class="v2langs"><button class="v2lang '+(lang==='en'?'on':'')+'" data-l="en"><b>English</b><small>Formal discovery wording</small></button><button class="v2lang '+(lang==='mix'?'on':'')+'" data-l="mix"><b>Marathi + English</b><small>Practical onsite conversation</small></button></div></section><div class="v2grid"><section class="v2panel"><h2>Discovery sessions</h2><div id="v2sessions"></div><button class="v2btn primary" id="v2new">+ New session</button></section><section class="v2panel"><h2>Session details</h2><div id="v2form"></div></section></div></div>';document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem('p11v2_lang',lang);home()});q('v2new').onclick=newSession;renderSessions();renderForm()
}
function newSession(){let id='sess_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),a=allSessions();a.unshift({id,name:'Discovery '+new Date().toLocaleDateString(),company:'',site:'',date:new Date().toISOString().slice(0,10),participants:'',sessionNotes:'',created:new Date().toISOString(),updated:new Date().toISOString()});putSessions(a);sid=id;localStorage.setItem('p11v2_current',sid);home();toast('Session created')}
function select(id){sid=id;localStorage.setItem('p11v2_current',id);renderSessions();renderForm();subtitle()}
function renderSessions(){let h=q('v2sessions'),a=allSessions();if(!a.length){h.innerHTML='<div class="v2empty">Create one session per visit, site or discovery round.</div>';return}h.innerHTML=a.map(s=>{let d=ans(s.id),done=Object.keys(d).filter(k=>{let x=d[k];return x.status||x.notes||x.flag||x.audioCount}).length;return'<div class="v2session '+(sid===s.id?'sel':'')+'" data-id="'+s.id+'"><div class="v2smain"><b>'+esc(s.name)+'</b><small>'+esc(s.company||'Company not set')+' • '+done+'/'+flat.length+' • '+new Date(s.updated).toLocaleString()+'</small></div><span class="v2pill">'+Math.round(done/flat.length*100)+'%</span><button class="v2btn v2icon" data-more="'+s.id+'">•••</button></div>'}).join('');document.querySelectorAll('.v2session').forEach(e=>e.onclick=x=>{if(x.target.closest('[data-more]'))return;select(e.dataset.id)});document.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();menu(b.dataset.more)})}
function menu(id){let act=prompt('Session action: rename / duplicate / delete','rename');if(!act)return;act=act.toLowerCase().trim();if(act==='rename'){let s=session(id),n=prompt('New session name',s.name);if(n){sid=id;updMeta({name:n});home()}}else if(act==='duplicate')duplicate(id);else if(act==='delete')delSession(id)}
function renderForm(){let h=q('v2form'),s=session();if(!s){h.innerHTML='<div class="v2empty">Select a session.</div>';return}h.innerHTML=['name','company','site','date','participants','sessionNotes'].map(k=>{let labels={name:'Session name',company:'Company',site:'Site / location',date:'Visit date',participants:'Participants / contacts',sessionNotes:'Overall session notes'};let ta=k==='participants'||k==='sessionNotes';return'<div class="v2field"><label>'+labels[k]+'</label>'+(ta?'<textarea data-m="'+k+'">'+esc(s[k]||'')+'</textarea>':'<input '+(k==='date'?'type="date" ':'')+'data-m="'+k+'" value="'+attr(s[k]||'')+'">')+'</div>'}).join('')+'<button class="v2btn primary" id="v2continue" style="width:100%">Continue discovery →</button>';document.querySelectorAll('[data-m]').forEach(x=>x.oninput=()=>updMeta({[x.dataset.m]:x.value}));q('v2continue').onclick=()=>{let a=ans(),n=flat.findIndex(z=>{let d=a[z.key]||{};return !(d.status||d.notes||d.flag||d.audioCount)});idx=n<0?0:n;question()}}
async function duplicate(id){let src=session(id),nid='sess_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),a=allSessions();a.unshift(Object.assign({},src,{id:nid,name:src.name+' Copy',created:new Date().toISOString(),updated:new Date().toISOString()}));putSessions(a);localStorage.setItem(akey(nid),localStorage.getItem(akey(id))||'{}');let ks=await audioKeys(id);for(let k of ks){let b=await getAudio(k);await putAudio(k.replace(id+'::',nid+'::'),b)}sid=nid;home();toast('Session duplicated')}
async function delSession(id){if(!confirm('Delete this session and all its local audio?'))return;putSessions(allSessions().filter(x=>x.id!==id));localStorage.removeItem(akey(id));for(let k of await audioKeys(id))await delAudio(k);if(sid===id)sid=allSessions()[0]?.id||null;localStorage.setItem('p11v2_current',sid||'');home();toast('Session deleted')}
function question(){if(!sid)return home();q('v2bottom').style.display='block';let z=flat[idx],d=ans()[z.key]||{},pct=Math.round((idx+1)/flat.length*100),ts=terms[z.si]||[];q('v2main').innerHTML='<div class="v2work"><div class="v2progressrow"><div class="v2progress"><i style="width:'+pct+'%"></i></div><div class="v2muted">'+(idx+1)+' / '+flat.length+'</div></div><article class="v2qcard"><div class="v2eyebrow">'+(z.si+1)+'. '+esc(lbl(z.si))+'</div><div class="v2q">'+esc(lang==='en'?z.en:z.mix)+'</div><details class="v2help"><summary>Context, what to capture & terms</summary><p>'+esc(contexts[z.si]||'Capture the current-state answer and supporting evidence without changing production systems.')+'</p><div class="v2terms">'+ts.map(t=>'<button class="v2term" data-term="'+attr(t)+'">'+esc(t)+'</button>').join('')+'</div><div id="v2def" class="v2def"></div></details><div class="v2choices">'+['Yes','No','Unknown','N/A'].map(v=>'<label class="v2choice"><input type="radio" name="v2status" value="'+v+'" '+(d.status===v?'checked':'')+'><span>'+v+'</span></label>').join('')+'</div><label class="v2label">Notes / exact answer / evidence / paths / follow-up</label><textarea class="v2notes" id="v2notes" placeholder="Capture exact paths, versions, names, evidence references, exceptions and what still needs verification.">'+esc(d.notes||'')+'</textarea><div class="v2audio"><div class="v2audiohead"><b>Audio notes</b><span class="v2muted">Multiple recordings allowed</span></div><button class="v2btn v2rec" id="v2rec">● Record audio</button><div id="v2audios"></div></div><label class="v2flag"><input type="checkbox" id="v2flag" '+(d.flag?'checked':'')+'> Mark for follow-up / risk review</label><div class="v2nav"><button class="v2btn" id="v2prev">← Back</button><button class="v2btn" id="v2skip">Skip</button><button class="v2btn primary" id="v2next">'+(idx===flat.length-1?'Finish / Review':'Next →')+'</button></div><div class="v2save">Autosaves every change. Manual Save remains available below.</div></article></div>';document.querySelectorAll('input[name=v2status]').forEach(x=>x.onchange=()=>setAns(z.key,{status:x.value}));q('v2notes').oninput=()=>setAns(z.key,{notes:q('v2notes').value});q('v2flag').onchange=()=>setAns(z.key,{flag:q('v2flag').checked});document.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>q('v2def').innerHTML='<b>'+esc(b.dataset.term)+':</b> '+esc(defs[b.dataset.term]||'No definition added.'));q('v2rec').onclick=()=>record(z.key);q('v2prev').onclick=()=>jump(Math.max(0,idx-1));q('v2skip').onclick=()=>jump(Math.min(flat.length-1,idx+1));q('v2next').onclick=()=>idx===flat.length-1?review():jump(idx+1);renderAudios(z.key)}

const dbp=new Promise((ok,no)=>{let r=indexedDB.open('p11v2_audio',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('a');r.onsuccess=e=>ok(e.target.result);r.onerror=no});
async function putAudio(k,b){let db=await dbp;return new Promise(ok=>{let t=db.transaction('a','readwrite');t.objectStore('a').put(b,k);t.oncomplete=ok})}
async function getAudio(k){let db=await dbp;return new Promise(ok=>{let r=db.transaction('a').objectStore('a').get(k);r.onsuccess=()=>ok(r.result)})}
async function delAudio(k){let db=await dbp;return new Promise(ok=>{let t=db.transaction('a','readwrite');t.objectStore('a').delete(k);t.oncomplete=ok})}
async function audioKeys(id=sid){let db=await dbp;return new Promise(ok=>{let out=[],r=db.transaction('a').objectStore('a').openCursor();r.onsuccess=e=>{let c=e.target.result;if(!c)return ok(out);if(String(c.key).startsWith(id+'::'))out.push(String(c.key));c.continue()}})}
async function qAudio(key){return(await audioKeys()).filter(k=>k.startsWith(sid+'::'+key+'::'))}
function ext(t){return(t||'').includes('mp4')?'m4a':(t||'').includes('ogg')?'ogg':(t||'').includes('wav')?'wav':'webm'}
async function record(key){if(mr&&mr.state==='recording'){mr.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mr=new MediaRecorder(stream);rec={key,stream};q('v2rec').classList.add('recording');q('v2rec').textContent='■ Stop recording';mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mr.onstop=async()=>{let b=new Blob(chunks,{type:mr.mimeType||'audio/webm'}),k=sid+'::'+key+'::'+Date.now().toString(36);await putAudio(k,b);rec.stream.getTracks().forEach(t=>t.stop());mr=null;rec=null;let ks=await qAudio(key);setAns(key,{audioCount:ks.length});q('v2rec').classList.remove('recording');q('v2rec').textContent='● Record audio';renderAudios(key);toast('Audio saved locally')};mr.start()}catch(e){alert('Microphone unavailable. Open the HTTPS site and allow microphone permission.')}}
async function renderAudios(key){let h=q('v2audios');if(!h)return;let ks=await qAudio(key);if(!ks.length){h.innerHTML='<div class="v2muted" style="margin-top:7px">No recordings yet.</div>';return}h.innerHTML='';for(let [i,k] of ks.entries()){let b=await getAudio(k),u=URL.createObjectURL(b),r=document.createElement('div');r.className='v2audioitem';r.innerHTML='<span class="v2pill">Audio '+(i+1)+'</span><audio controls src="'+u+'"></audio><button class="v2btn" data-d>Download</button><button class="v2btn danger" data-x>Delete</button>';r.querySelector('[data-d]').onclick=()=>download('audio-'+key+'-'+(i+1)+'.'+ext(b.type),b);r.querySelector('[data-x]').onclick=async()=>{if(confirm('Delete this recording?')){await delAudio(k);let left=await qAudio(key);setAns(key,{audioCount:left.length});renderAudios(key)}};h.appendChild(r)}}
function openSearch(){q('v2drawer').classList.add('open');q('v2searchbox').focus();search(q('v2searchbox').value)}
function search(v){let t=(v||'').toLowerCase().trim(),hits=flat.filter(z=>{let blob=[z.en,z.mix,S[z.si][0][0],S[z.si][0][1],contexts[z.si],...(terms[z.si]||[]),...(terms[z.si]||[]).map(x=>defs[x]||'')].join(' ').toLowerCase();return!t||blob.includes(t)}).slice(0,100);q('v2results').innerHTML=hits.map(z=>'<div class="v2res" data-k="'+z.key+'"><b>'+esc(lang==='en'?z.en:z.mix)+'</b><small>'+esc(lbl(z.si))+' • '+esc((terms[z.si]||[]).join(', '))+'</small></div>').join('')||'<div class="v2empty">No matching questions.</div>';document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{let i=flat.findIndex(z=>z.key===e.dataset.k);if(i>=0){idx=i;q('v2drawer').classList.remove('open');question()}})}
function review(){if(!sid)return home();q('v2bottom').style.display='block';let a=ans(),done=0,flags=0,unknown=0,audios=0;flat.forEach(z=>{let d=a[z.key]||{};if(d.status||d.notes||d.audioCount)done++;if(d.flag)flags++;if(d.status==='Unknown')unknown++;audios+=d.audioCount||0});let html='<div class="v2review"><div class="v2stats"><div class="v2stat"><b>'+done+'/'+flat.length+'</b>Answered</div><div class="v2stat"><b>'+flags+'</b>Follow-ups</div><div class="v2stat"><b>'+unknown+'</b>Unknown</div><div class="v2stat"><b>'+audios+'</b>Audio notes</div></div>';S.forEach((s,si)=>{let rows='';s[2].forEach((qq,qi)=>{let key='s'+si+'q'+qi,d=a[key]||{};if(d.status||d.notes||d.flag||d.audioCount)rows+='<div class="v2ri" data-j="'+key+'"><b>'+esc(lang==='en'?qq[0]:qq[1])+'</b><br><small>Status: '+esc(d.status||'—')+(d.flag?' • ⚑ follow-up':'')+(d.audioCount?' • '+d.audioCount+' audio':'')+'</small>'+(d.notes?'<div>'+esc(d.notes)+'</div>':'')+'</div>'});if(rows)html+='<section class="v2rsec"><h3>'+esc(lbl(si))+'</h3>'+rows+'</section>'});q('v2main').innerHTML=html+'</div>';document.querySelectorAll('[data-j]').forEach(e=>e.onclick=()=>{idx=flat.findIndex(z=>z.key===e.dataset.j);question()})}
async function buildAudio(zip){let out=[],counts={};for(let k of await audioKeys()){let p=k.split('::'),key=p[1],b=await getAudio(k);if(!b)continue;counts[key]=(counts[key]||0)+1;let path='audio/'+key+'-'+counts[key]+'.'+ext(b.type);out.push({questionKey:key,path,mimeType:b.type,size:b.size});if(zip)zip.file(path,b)}return out}
function exportObj(ai){let s=session(),a=ans();return{format:'part11-discovery-v2',exportedAt:new Date().toISOString(),language:lang,session:s,audioFiles:ai,sections:S.map((sec,si)=>({section:lbl(si),context:contexts[si],terms:terms[si],questions:sec[2].map((qq,qi)=>{let key='s'+si+'q'+qi,d=a[key]||{};return{key,question:lang==='en'?qq[0]:qq[1],status:d.status||'',notes:d.notes||'',flag:!!d.flag,audioFiles:(ai||[]).filter(x=>x.questionKey===key).map(x=>x.path)}})}))}}
async function exportJSON(){if(!sid)return;let ai=await buildAudio(null);download(safe(session().name)+'.json',new Blob([JSON.stringify(exportObj(ai),null,2)],{type:'application/json'}))}
async function exportZIP(){if(!sid)return;if(!window.JSZip){alert('ZIP component could not load. Check internet and retry. JSON export remains available.');return}toast('Building ZIP…');let zip=new JSZip(),ai=await buildAudio(zip),o=exportObj(ai);zip.file('discovery.json',JSON.stringify(o,null,2));zip.file('README.txt','21 CFR Part 11 IT Discovery export\n\ndiscovery.json contains structured answers and references each recording under /audio.\nAudio files are retained as source context/evidence and must be reviewed before formal compliance conclusions are made.\n');zip.file('summary.md',summary(o));download(safe(session().name)+'-export.zip',await zip.generateAsync({type:'blob',compression:'DEFLATE'}));toast('ZIP exported')}
function summary(o){let x=['# 21 CFR Part 11 Discovery','', '**Session:** '+(o.session?.name||''),'**Company:** '+(o.session?.company||''),'**Site:** '+(o.session?.site||''),'**Date:** '+(o.session?.date||''),''];o.sections.forEach(s=>{let rows=s.questions.filter(z=>z.status||z.notes||z.flag||z.audioFiles.length);if(!rows.length)return;x.push('## '+s.section,'');rows.forEach(z=>{x.push('### '+z.question,'- Status: '+(z.status||'—'),'- Follow-up: '+(z.flag?'Yes':'No'));if(z.notes)x.push('- Notes: '+z.notes);if(z.audioFiles.length)x.push('- Audio: '+z.audioFiles.join(', '));x.push('')})});return x.join('\n')}
function safe(x){return String(x||'discovery').trim().replace(/[^a-z0-9_-]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'discovery'}
function download(n,b){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
sid=localStorage.getItem('p11v2_current')||allSessions()[0]?.id||null;if(sid&&!session())sid=allSessions()[0]?.id||null;shell();
})();
</script>
